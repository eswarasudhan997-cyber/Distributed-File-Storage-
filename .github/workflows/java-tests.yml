name: Java checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile application and core tests
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out \
            src/main/java/BTree.java \
            src/main/java/StorageSystem.java \
            src/test/java/StorageSystemTests.java

      - name: Run core regression tests
        run: java -cp out StorageSystemTests